name: publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# id-token: write lets npm exchange a short-lived OIDC token with the registry
# (trusted publishing) and sign SLSA provenance. No npm token is stored anywhere.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # bun publish cannot do npm OIDC trusted publishing (oven-sh/bun#22423);
      # only npm >= 11.5.1 performs the tokenless exchange, so publishing runs
      # through Node's npm while Bun does everything else.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test
        run: |
          bun run lint
          bun run typecheck
          bun test

      # tsc does not clean dist; stale artifacts from earlier builds once shipped
      # in the 0.5.0 tarball. Wipe first.
      - name: Build fresh dist
        run: rm -rf dist && bun run build

      - name: Verify declarations resolve
        run: bun run verify:dist

      - name: Inspect tarball contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
